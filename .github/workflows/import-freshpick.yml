name: Import pinned FreshPick website
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-freshpick.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.event.head_commit.message == 'Bootstrap pinned FreshPick import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: target
      - uses: actions/checkout@v4
        with:
          repository: FreshOnTime/newfreshontimewebsite
          ref: 51a4bb811f78cfac5319fdd82c2d5de09e215559
          path: source
          persist-credentials: false
      - name: Copy exact source files and assets
        run: |
          rsync -a --exclude=.git --exclude=.github/workflows/ source/ target/
          cd target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Copy FreshPick website from source 51a4bb8"
          git push origin HEAD:main
